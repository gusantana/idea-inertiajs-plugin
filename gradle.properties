# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = nz.hailwood.inertiajs
pluginName = Inertia.js Support
pluginVersion = 0.2.0
pluginRepositoryUrl = https://github.com/gusantana/idea-inertiajs-plugin

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 262
pluginUntilBuild = 262.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
platformType = PS
platformVersion = 2026.2.4

# Bundled Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformBundledPlugins = com.jetbrains.php, JavaScript, com.intellij.css, org.jetbrains.plugins.vue

# Marketplace Plugin Dependencies (id:version, comma separated)
# The Svelte plugin is optional for the built plugin (see plugin.xml) but required to test and run the Svelte features.
platformPlugins = dev.blachut.svelte.lang:262.10968.63

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.1.0

# Opt-out flag for bundling Kotlin standard library -> https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library
# suppress inspection "UnusedProperty"
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
# suppress inspection "UnusedProperty"
org.gradle.configuration-cache = true

# The IntelliJ Platform Gradle Plugin needs a larger heap to configure the build.
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
